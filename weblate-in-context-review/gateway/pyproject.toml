[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[project]
name = "weblate-in-context-review-gateway"
version = "0.1.0"
description = "Credential-isolating gateway for Weblate in-context review"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = ["pytest>=8.4"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv.build-backend]
module-name = "weblate_in_context_gateway"
